# Reload config
bind=SUPER,r,reload_config

# Apps
bind=SUPER,space,spawn,fuzzel
bind=SUPER,Return,spawn,ghostty

# Quit MangoWC
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# Window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# Window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,backslash,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,z,toggle_scratchpad

# Scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset

# Switch layout
bind=SUPER,n,switch_layout

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+Alt,1,tag,1,0
bind=SUPER+Alt,2,tag,2,0
bind=SUPER+Alt,3,tag,3,0
bind=SUPER+Alt,4,tag,4,0
bind=SUPER+Alt,5,tag,5,0
bind=SUPER+Alt,6,tag,6,0
bind=SUPER+Alt,7,tag,7,0
bind=SUPER+Alt,8,tag,8,0
bind=SUPER+Alt,9,tag,9,0

# Gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# Move windows
bind=SUPER+SHIFT,Up,movewin,+0,-50
bind=SUPER+SHIFT,Down,movewin,+0,+502
bind=SUPER+SHIFT,Left,movewin,-50,+0
bind=SUPER+SHIFT,Right,movewin,+50,+0

# Resize windows
bind=SUPER+Alt,Up,resizewin,+0,-50
bind=SUPER+Alt,Down,resizewin,+0,+50
bind=SUPER+Alt,Left,resizewin,-50,+0
bind=SUPER+Alt,Right,resizewin,+50,+0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Screenshots
bind=SUPER+SHIFT,s,spawn_shell,slurp | grim -g - - | wl-copy

# Emoji picker
bind=SUPER,period,spawn,emote
